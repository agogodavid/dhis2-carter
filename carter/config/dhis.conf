# Carter Consulting DHIS2 test instance
connection.dialect = org.hibernate.dialect.PostgreSQLDialect
connection.driver_class = org.postgresql.Driver
connection.url = jdbc:postgresql://${DB_HOSTNAME}/${DB_NAME}
connection.username = ${DB_USERNAME}
connection.password = ${DB_PASSWORD}

# Local test env runs on plain http behind localhost
server.https = off
server.base.url = http://localhost:8080

# Make test-env behaviour obvious in audit/logs
system.read_only_mode = off
audit.metadata = CREATE;UPDATE;DELETE
audit.tracker = CREATE;UPDATE;DELETE
audit.aggregate = CREATE;UPDATE;DELETE

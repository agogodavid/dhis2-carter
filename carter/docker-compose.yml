# Carter Consulting — DHIS2 2.43.2.1 TEST environment
# NOT for production. Ports are bound to 127.0.0.1 only.
#
#   cp .env.example .env && ./scripts/up.sh
#
# Profiles:
#   (default)      DHIS2 web + PostGIS + Sierra Leone demo database
#   compasslink    also runs a mock Compass API + the CompassLink connector
#   local-build    use an image built from this fork's source (scripts/build-local.sh)

name: carter-dhis2-test

services:
  web:
    image: "${DHIS2_IMAGE:-dhis2/core:2.43.2.1}"
    restart: unless-stopped
    environment:
      DB_HOSTNAME: db
      DB_NAME: ${DB_NAME:-dhis}
      DB_USERNAME: ${DB_USERNAME:-dhis}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # JAVA_TOOL_OPTIONS works for both tomcat-based and distroless (jib) images
      JAVA_TOOL_OPTIONS: "${JAVA_MEMORY:--Xms1g -Xmx3g} -Dlog4j2.configurationFile=/opt/dhis2/log4j2.xml"
    volumes:
      - ./config/dhis.conf:/opt/dhis2/dhis.conf:ro
      - ./config/log4j2.xml:/opt/dhis2/log4j2.xml:ro
      - dhis2-files:/opt/dhis2/files
    ports:
      - "127.0.0.1:${DHIS2_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    # No container healthcheck: release images may be distroless (no shell).
    # Use scripts/wait-ready.sh from the host; CompassLink waits via --wait.

  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-dhis}
      POSTGRES_DB: ${DB_NAME:-dhis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      PGPASSWORD: ${DB_PASSWORD}
    command: ["postgres", "-c", "max_locks_per_transaction=128", "-c", "shared_buffers=512MB", "-c", "jit=off"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-dump:/docker-entrypoint-initdb.d/:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 600s
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db-dump:
        condition: service_completed_successfully

  # Downloads the demo DB once into a volume; postgres loads it on first init.
  # Set DHIS2_DB_DUMP_URL to an empty-db dump or a Carter test snapshot to override.
  db-dump:
    image: busybox:1.36
    working_dir: /opt/dump
    command: sh -c '[ -f dump.sql.gz ] && echo "dump present" || wget -O dump.sql.gz "$$DHIS2_DB_DUMP_URL"'
    environment:
      DHIS2_DB_DUMP_URL: "${DHIS2_DB_DUMP_URL:-https://databases.dhis2.org/sierra-leone/2.43/dhis2-db-sierra-leone.sql.gz}"
    volumes:
      - db-dump:/opt/dump

  # ---- CompassLink integration testing (profile: compasslink) ----
  compass-mock:
    profiles: [compasslink]
    build: ../../compasslink
    command: ["node", "dist/scripts/mock-compass.js"]
    environment:
      MOCK_COMPASS_PORT: "4010"
    ports:
      - "127.0.0.1:4010:4010"

  compasslink:
    profiles: [compasslink]
    build: ../../compasslink
    command: ["node", "dist/src/cli.js", "sync", "--config", "/config/compasslink.yml", "--wait", "1800"]
    environment:
      COMPASS_BASE_URL: http://compass-mock:4010
      COMPASS_API_TOKEN: ${COMPASS_API_TOKEN:-mock-token}
      DHIS2_BASE_URL: http://web:8080
      DHIS2_USERNAME: ${DHIS2_USERNAME:-admin}
      DHIS2_PASSWORD: ${DHIS2_PASSWORD:-district}
      DHIS2_API_TOKEN: ${DHIS2_API_TOKEN:-}
      COMPASSLINK_STATE_FILE: /state/compasslink-state.json
    volumes:
      - ../../compasslink/config/compasslink.example.yml:/config/compasslink.yml:ro
      - compasslink-state:/state
    depends_on:
      web:
        condition: service_started
      compass-mock:
        condition: service_started

volumes:
  db-data: {}
  db-dump: {}
  dhis2-files: {}
  compasslink-state: {}
